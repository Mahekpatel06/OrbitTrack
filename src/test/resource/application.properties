spring.application.name=IssTelemetryTracker
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/telemetrydb
spring.datasource.username={your_postgre_username}
spring.datasource.password={your_postgre_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false


# Space Telemetry & Satellite Configuration

# Target NORAD Satellite Catalog ID (25544 is ISS)
app.satellite.norad-id=25544

# N2YO Satellite API Configuration
app.n2yo.api-key={your_n2yo_api_key}
app.n2yo.base-url=https://api.n2yo.com/rest/v1/satellite/positions
app.n2yo.observer-lat=22.55896
app.n2yo.observer-lon=72.91993
app.n2yo.observer-alt=0

# Celestrak TLE Ephemeris Configuration
app.celestrak.tle-url=https://celestrak.org/NORAD/elements/gp.php

# Ground Station Geofencing Airspace Radius (km)
app.geofence.max-distance-km=2000.0

# ---------------------------------------------------------
# Automated Flyover Email Notification Dispatcher
# ---------------------------------------------------------
# Set to 'true' to dispatch real emails via SMTP. Set to 'false' for local simulation logging.
app.notifications.mail-enabled=true

app.notifications.window-hours=2

# SMTP Configuration (Gmail SMTP)
# IMPORTANT:
# 1. Put your real Gmail address in spring.mail.username
# 2. Put your 16-character Google App Password in spring.mail.password (e.g. abcd efgh ijkl mnop)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username={your_email}
spring.mail.password={your_16-char_google_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000